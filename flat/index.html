document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ion-fg);}\n\na{color:var(--link);text-decoration:none;}\na:hover{color:var(--link-hover);}\na:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset);}\n\n/* Links ─ background moves, text darkens */\n.ds-link{\n  color:var(--link);\n  border-bottom:1px solid var(--link-rule);\n  padding:2px 4px 3px;\n  transition:background var(--ease-hover),color var(--ease-hover),border-color var(--ease-hover);\n}\n.ds-link:hover,.ds-link:focus-visible{\n  background:var(--surface-hover);\n  color:var(--link-hover);\n  border-bottom-color:var(--link-hover);\n}\n.ds-link--secondary{color:var(--link-secondary);border-bottom-color:var(--link-secondary-rule);}\n.ds-link--secondary:hover,.ds-link--secondary:focus-visible{\n  color:var(--link-secondary-hover);\n  border-bottom-color:var(--link-secondary-hover);\n}\n\n/* Nav ─ colour only, no rule */\n.ds-navlink{color:var(--text-secondary);transition:color var(--ease-hover);}\n.ds-navlink:hover{color:var(--text-heading);}\n.ds-navlink[aria-current]{color:var(--text-heading);}\n\n/* Clickable rows and tiles ─ tint the ground, hold the text */\n.ds-row{background:var(--surface-raised);transition:background var(--ease-hover);}\n.ds-row:hover{background:var(--surface-hover);}\n.ds-row__arrow{color:var(--text-accent);align-self:center;justify-self:end;display:inline-block;transition:transform var(--ease-nudge);}\n.ds-row:hover .ds-row__arrow{transform:translateX(var(--nudge-distance));}\n.ds-tile{transition:background var(--ease-hover),box-shadow var(--ease-hover);}\n.ds-tile:hover{background:var(--surface-hover);}\n\n/* Images zoom on the inner element only */\n.ds-zoom{transition:transform .45s cubic-bezier(.2,.7,.3,1);}\n.ds-zoom-host:hover .ds-zoom{transform:scale(var(--image-zoom));}\n\n/* Accordion ─ height animates, glyph swaps, never rotates */\n.ds-accordion__panel{overflow:hidden;height:0;opacity:0;transition:height var(--ease-panel),opacity var(--ease-hover);}\n.ds-accordion__panel[data-open=\"true\"]{opacity:1;}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;}\n}\n\n<\u002Fstyle>\n<script src=\"4d48597b-a1dc-4fab-b9ed-a9d417e28df4\"><\u002Fscript>\n<style>\nbody{overflow-x:clip;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:var(--font-sans);color:var(--ink-900);background:var(--surface-page);-webkit-font-smoothing:antialiased\">\n\n  <header data-screen-label=\"Home\" style=\"position:sticky;top:0;z-index:60;background:var(--surface-header);border-bottom:1px solid var(--border-rule)\">\n    <div style=\"max-width:var(--container-max);margin:0 auto;padding:var(--header-pad-y) var(--container-pad);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px\">\n      <a href=\"Home.dc.html\" style=\"font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--ink-900)\">Bruce Criscuolo<\u002Fa>\n      <nav style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:clamp(12px,1.8vw,26px);font-size:13px;font-weight:500;letter-spacing:0.01em\">\n        <a class=\"ds-navlink\" href=\"Work.dc.html\">Work<\u002Fa>\n        <a class=\"ds-navlink\" href=\"About.dc.html\">About<\u002Fa>\n        <a class=\"ds-navlink\" href=\"Resume.dc.html\">Resume<\u002Fa>\n        <a class=\"ds-navlink\" href=\"Contact.dc.html\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"max-width:var(--container-max);margin:0 auto;padding:0 var(--container-pad)\">\n\n    <section style=\"padding:var(--gap-section-y) 0 var(--gap-block);display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:13px\">\n        <span style=\"display:inline-flex;align-items:center;gap:9px;font-weight:600;letter-spacing:-0.005em;color:var(--ink-700)\"><span style=\"width:8px;height:8px;border-radius:50%;background:var(--status-available);display:inline-block\"><\u002Fspan>Open to conversations<\u002Fspan>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:13px;font-weight:500;letter-spacing:0.02em;color:var(--ink-500);text-wrap:pretty\">Principal Experience Designer &nbsp;·&nbsp; Design Leader &nbsp;·&nbsp; Sensemaker<\u002Fdiv>\n        <h1 style=\"margin:20px 0 0;max-width:var(--measure-heading);font-size:var(--type-title-size);font-weight:500;letter-spacing:-0.038em;line-height:1.03;text-wrap:pretty\">I make complex things understandable.<\u002Fh1>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-lead);font-size:var(--type-lead-size);line-height:1.6;color:var(--ink-700);text-wrap:pretty\">I turn complicated organizations, services, and emerging technologies into experiences people can understand and businesses can act on. Twenty-five years across strategy, research, product, service design, and AI. Still hands-on.<\u002Fp>\n        <div style=\"margin-top:var(--gap-heading-to-content);display:flex;flex-wrap:wrap;align-items:baseline;gap:clamp(20px,3vw,32px)\">\n          <a class=\"ds-link\" href=\"Work.dc.html\" style=\"font-size:var(--type-cta-size);font-weight:var(--type-cta-weight);letter-spacing:var(--type-cta-tracking)\">View selected work<\u002Fa>\n          <a class=\"ds-link ds-link--secondary\" href=\"Resume.dc.html\" style=\"font-size:15px;font-weight:500\">Read my resume<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">02<\u002Fspan><br>Proof<\u002Fdiv>\n      <div>\n        <div style=\"overflow:hidden\"><div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:0 -1px -1px 0;\">\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:clamp(130px,15vw,170px);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">25+<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Years in practice<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:clamp(130px,15vw,170px);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">51<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Brands<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:clamp(130px,15vw,170px);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">1,000+<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Customer interviews<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;justify-content:flex-end;min-height:clamp(130px,15vw,170px);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">14<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Industries<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"margin:20px 0 0;max-width:var(--measure-body);font-size:13px;line-height:1.6;color:var(--ink-400)\">Awards and client outcomes stay attached to the projects that earned them.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">03<\u002Fspan><br>Selected work<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">Three different forms of value.<\u002Fh2>\n        <a class=\"ds-row\" href=\"PSEG.dc.html\" style=\"display:block;margin-top:var(--gap-heading-to-content);color:var(--ink-900);border:1px solid var(--border-rule)\">\n          <span style=\"display:block;height:clamp(240px,32vw,420px);border-bottom:1px solid var(--border-rule)\">\n            <image-slot id=\"home-pseg\" shape=\"rect\" fit=\"cover\" placeholder=\"PSEG featured image\"><\u002Fimage-slot>\n          <\u002Fspan>\n          <span style=\"display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:clamp(14px,2.4vw,32px);align-items:end;padding:var(--card-padding)\">\n            <span style=\"display:block;min-width:0\">\n              <span style=\"display:flex;flex-wrap:wrap;align-items:center;gap:16px\">\n                <span style=\"height:30px;min-width:96px;border:1px dashed var(--border-rule);display:grid;place-items:center;font-size:11px;color:var(--ink-400)\">PSE&amp;G logo<\u002Fspan>\n                <span style=\"font-size:13px;font-weight:500;letter-spacing:0.02em;color:var(--ink-500)\">Enterprise CX<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:block;margin-top:18px;font-size:clamp(22px,2.6vw,32px);font-weight:500;letter-spacing:-0.03em;line-height:1.15;text-wrap:pretty\">PSEG<\u002Fspan>\n              <span style=\"display:block;margin-top:8px;max-width:var(--measure-heading);font-size:clamp(17px,1.8vw,21px);font-weight:500;letter-spacing:-0.02em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Turning customer understanding into a system for change<\u002Fspan>\n              <span style=\"display:block;margin-top:14px;max-width:var(--measure-body);font-size:15px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">Enterprise CX, behavioral models, IA, content strategy, and a reusable delivery system.<\u002Fspan>\n              <span style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:20px\">\n                <span style=\"border:1px solid var(--border-rule);border-radius:var(--radius-tag);padding:5px 10px;font-size:13px;color:var(--ink-700)\">Research<\u002Fspan>\n                <span style=\"border:1px solid var(--border-rule);border-radius:var(--radius-tag);padding:5px 10px;font-size:13px;color:var(--ink-700)\">Information architecture<\u002Fspan>\n                <span style=\"border:1px solid var(--border-rule);border-radius:var(--radius-tag);padding:5px 10px;font-size:13px;color:var(--ink-700)\">Content strategy<\u002Fspan>\n              <\u002Fspan>\n            <\u002Fspan>\n            <span class=\"ds-row__arrow\">→<\u002Fspan>\n          <\u0 ze:13px;color:var(--ink-700)\">Operational analysis<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;justify-content:flex-end;margin-top:auto;padding-top:8px\"><span class=\"ds-row__arrow\">→<\u002Fspan><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fa>\n          <a class=\"ds-row\" href=\"SuperForged.dc.html\" style=\"display:flex;flex-direction:column;color:var(--ink-900);border:1px solid var(--border-rule)\">\n            <span style=\"display:block;height:170px;border-bottom:1px solid var(--border-rule)\">\n              <image-slot id=\"home-superforged\" shape=\"rect\" fit=\"cover\" placeholder=\"SuperForged image\"><\u002Fimage-slot>\n            <\u002Fspan>\n            <span style=\"display:flex;flex-direction:column;flex:1;gap:12px;padding:var(--card-padding)\">\n              <span style=\"display:flex;align-items:center;gap:12px\">\n                <img src=\"15a9a6d8-17e3-4d10-9554-33bb8c367cec\" alt=\"SuperForged\" style=\"height:22px;width:auto;mix-blend-mode:multiply\">\n              <\u002Fspan>\n              <span style=\"display:block;font-size:clamp(19px,2vw,23px);font-weight:500;letter-spacing:-0.025em;line-height:1.2;text-wrap:pretty\">SuperForged<\u002Fspan>\n              <span style=\"display:block;font-size:16px;font-weight:500;letter-spacing:-0.015em;line-height:1.35;color:var(--ink-700);text-wrap:pretty\">Designing the product, business, and customer experience together<\u002Fspan>\n              <span style=\"display:block;font-size:15px;line-height:1.55;color:var(--ink-500);text-wrap:pretty\">Founder-led physical product, commerce, operations, and customer accountability.<\u002Fspan>\n              <span style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <span style=\"border:1px solid var(--border-rule);border-radius:var(--radius-tag);padding:4px 9px;font-size:13px;color:var(--ink-700)\">Product direction<\u002Fspan>\n                <span style=\"border:1px solid var(--border-rule);border-radius:var(--radius-tag);padding:4px 9px;font-size:13px;color:var(--ink-700)\">Commerce<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"display:flex;justify-content:flex-end;margin-top:auto;padding-top:8px\"><span class=\"ds-row__arrow\">→<\u002Fspan><\u002Fspan>\n            <\u002Fspan>\n          <\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">04<\u002Fspan><br>How I work<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">From ambiguity to something a business can act on.<\u002Fh2>\n        <div style=\"margin-top:var(--gap-heading-to-content);max-width:var(--measure-row);overflow:hidden\">\n          <div style=\"margin-bottom:-1px\">\n            <div style=\"display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--border-rule)\">\n              <span style=\"font-size:16px;font-weight:700;color:var(--text-accent);font-variant-numeric:tabular-nums\">01<\u002Fspan>\n              <div><h3 style=\"margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.35\">Ambiguity<\u002Fh3><p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">One or two sentences on what the starting condition usually looks like.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--border-rule)\">\n              <span style=\"font-size:16px;font-weight:700;color:var(--text-accent);font-variant-numeric:tabular-nums\">02<\u002Fspan>\n              <div><h3 style=\"margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.35\">Understanding<\u002Fh3><p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">One or two sentences on how evidence gets gathered and turned into a model.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--border-rule)\">\n              <span style=\"font-size:16px;font-weight:700;color:var(--text-accent);font-variant-numeric:tabular-nums\">03<\u002Fspan>\n              <div><h3 style=\"margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.35\">Direction<\u002Fh3><p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">One or two sentences on how understanding becomes a decision leadership can make.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;align-items:start;padding:16px 0;border-bottom:1px solid var(--border-rule)\">\n              <span style=\"font-size:16px;font-weight:700;color:var(--text-accent);font-variant-numeric:tabular-nums\">04<\u002Fspan>\n              <div><h3 style=\"margin:0;font-size:16px;font-weight:600;letter-spacing:-0.01em;line-height:1.35\">Delivery<\u002Fh3><p style=\"margin:8px 0 0;font-size:15px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">One or two sentences on how the direction survives contact with development.<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">05<\u002Fspan><br>Career range<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">Four kinds of responsibility, one practice.<\u002Fh2>\n        <div style=\"margin-top:var(--gap-heading-to-content);background:var(--surface-raised);box-shadow:var(--shadow-card);overflow:hidden\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));margin:0 -1px -1px 0\">\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:12px;padding:clamp(18px,2.2vw,26px);min-height:var(--bento-row-height);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <div style=\"margin-top:auto\"><h3 style=\"margin:0;font-size:clamp(17px,1.8vw,21px);font-weight:500;letter-spacing:-0.025em;line-height:1.15\">Enterprise consulting<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--ink-500);text-wrap:pretty\">One line on the scale and kind of client.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:12px;padding:clamp(18px,2.2vw,26px);min-height:var(--bento-row-height);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <div style=\"margin-top:auto\"><h3 style=\"margin:0;font-size:clamp(17px,1.8vw,21px);font-weight:500;letter-spacing:-0.025em;line-height:1.15\">Design leadership<\u002Fh3><p style=\"margin:10px 0 0;font-size:14px;line-height:1.55;color:var(--ink-500);text-wrap:pretty\">One line on team size and what change

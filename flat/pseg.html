document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"a27f1792-0fed-424a-84fe-4c6d2f48e599\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>@font-face{font-family:'Standerd';src:url(\"ed45dc33-9b1e-425b-aa56-97de0757c5fa\") format('woff2'),url(\"0bcb8d69-a583-42ea-8505-f633241ff845\") format('woff');font-weight:300;font-style:normal;font-display:swap;}\n@font-face{font-family:'Standerd';src:url(\"cf6e15fd-c582-481b-892f-dae73ed1f4ec\") format('woff2'),url(\"35a7df87-38f9-4a1e-99fc-26effb9b7492\") format('woff');font-weight:400;font-style:normal;font-display:swap;}\n@font-face{font-family:'Standerd';src:url(\"cf6e15fd-c582-481b-892f-dae73ed1f4ec\") format('woff2'),url(\"35a7df87-38f9-4a1e-99fc-26effb9b7492\") format('woff');font-weight:500;font-style:normal;font-display:swap;}\n@font-face{font-family:'Standerd';src:url(\"3cdc607f-b8d2-40f1-80b0-3f58648a1275\") format('woff2'),url(\"f385e44a-caeb-4406-96c8-76597fe57e40\") format('woff');font-weight:600;font-style:normal;font-display:swap;}\n@font-face{font-family:'Standerd';src:url(\"3cdc607f-b8d2-40f1-80b0-3f58648a1275\") format('woff2'),url(\"f385e44a-caeb-4406-96c8-76597fe57e40\") format('woff');font-weight:700;font-style:normal;font-display:swap;}\n\n:root{\n  /* ── Ink ───────────────────────────────────────────── */\n  --ink-900:#131313;   /* headings                           */\n  --ink-700:#3A3A38;   /* body                               */\n  --ink-600:#5A5A58;   /* secondary links, nav  6.4:1 on band*/\n  --ink-500:#6E6E6C;   /* muted text                         */\n  --ink-400:#8A8A87;   /* specs, faint labels                */\n\n  /* ── Accent ────────────────────────────────────────── */\n  --accent-800:#8F3E14;  /* link hover / active              */\n  --accent-700:#AB4C1C;  /* links, markers   5.1:1 on band   */\n  --accent-600:#B8541F;  /* display only — fails 4.5:1 as text */\n  --accent-300:#C98A66;  /* link underline   3.2:1           */\n  --accent-200:#E8CBBB;  /* decorative rule only            */\n  --accent-050:#FAF6F2;  /* warm tint (unused since v2)     */\n\n  /* ── Paper ─────────────────────────────────────────── */\n  --paper-000:#FFFFFF;  /* cards, tiles — raised            */\n  --paper-100:#F5F5F5;  /* page ground                      */\n  --paper-150:#F4F3EF;  /* image bed                        */\n  --paper-200:#F1F0EC;  /* panel                            */\n  --paper-300:#EDECE7;  /* header, footer band              */\n  --neutral-200:#ECECEC; /* hover tint — neutral, not warm  */\n\n  /* ── Lines ─────────────────────────────────────────── */\n  --line-200:#EFEEEA;  /* hairline — only legible on white  */\n  --line-300:#E4E3DE;  /* legacy rule (pre-v2)              */\n  --line-400:#D8D7D1;  /* rule — legible on the page ground */\n\n  --accent-on-dark:#C9A08A; /* accent legible on the lightbox scrim */\n  --green-500:#2E9E5B;\n\n  /* ── Semantic ──────────────────────────────────────── */\n  --text-heading:var(--ink-900);\n  --text-body:var(--ink-700);\n  --text-secondary:var(--ink-600);\n  --text-muted:var(--ink-500);\n  --text-faint:var(--ink-400);\n  --text-accent:var(--accent-700);\n  --text-inverse:var(--paper-000);\n\n  --surface-page:var(--paper-100);\n  --surface-raised:var(--paper-000);\n  --surface-band:var(--paper-100);\n  --surface-header:var(--paper-300);\n  --surface-footer:var(--paper-300);\n  --surface-panel:var(--paper-200);\n  --surface-image-bed:var(--paper-150);\n  --surface-card:var(--paper-000);\n  --surface-hover:var(--neutral-200);\n\n  --border-rule:var(--line-400);\n  --border-hairline:var(--line-400);\n  --border-hairline-on-white:var(--line-200);\n  --border-accent-rule:var(--accent-300);\n\n  --link:var(--accent-700);\n  --link-hover:var(--accent-800);\n  --link-rule:var(--accent-300);\n  --link-secondary:var(--ink-600);\n  --link-secondary-rule:var(--ink-400);\n  --link-secondary-hover:var(--ink-900);\n  --focus-ring:var(--ink-900);\n\n  --status-available:var(--green-500);\n  --selection-bg:var(--accent-700);\n  --selection-fg:var(--paper-000);\n}\n\n:root{\n  --font-sans:'Standerd','Archivo','Helvetica Neue',system-ui,sans-serif;\n  --font-fallback:'Archivo','Helvetica Neue',system-ui,sans-serif;\n\n  --weight-light:300;\n  --weight-regular:400;\n  --weight-medium:500;\n  --weight-semibold:600;\n  --weight-bold:700;\n\n  /* Page title */\n  --type-title-size:clamp(32px,5.4vw,68px);\n  --type-title-weight:500;\n  --type-title-tracking:-0.038em;\n  --type-title-leading:1.03;\n\n  /* Section heading */\n  --type-section-size:clamp(24px,3vw,38px);\n  --type-section-weight:500;\n  --type-section-tracking:-0.03em;\n  --type-section-leading:1.1;\n\n  /* Phase / sub heading */\n  --type-phase-size:clamp(20px,2.2vw,26px);\n  --type-phase-weight:500;\n  --type-phase-tracking:-0.025em;\n\n  /* Primary call to action link */\n  --type-cta-size:17px;\n  --type-cta-weight:500;\n  --type-cta-tracking:-0.01em;\n\n  /* Block label */\n  --type-label-size:17px;\n  --type-label-weight:600;\n  --type-label-tracking:-0.015em;\n\n  /* Lead paragraph */\n  --type-lead-size:clamp(17px,1.7vw,20px);\n  --type-lead-leading:1.6;\n\n  /* Body */\n  --type-body-size:16px;\n  --type-body-leading:1.65;\n\n  /* List row */\n  --type-row-size:15px;\n  --type-row-leading:1.55;\n\n  /* Micro / spec */\n  --type-micro-size:13px;\n  --type-micro-leading:1.6;\n\n  /* Section marker and row numerals */\n  --type-marker-size:16px;\n  --type-marker-weight:700;\n  --type-marker-leading:1.6;\n  --type-numeral-size:16px;\n  --type-numeral-weight:700;\n\n  /* Figures on stat tiles, by character count */\n  --type-figure-sm:clamp(22px,2.6vw,34px);\n  --type-figure-md:clamp(28px,3.4vw,46px);\n  --type-figure-lg:clamp(38px,4.6vw,62px);\n  --type-figure-tracking:-0.045em;\n  --type-figure-leading:0.95;\n\n  /* Measures */\n  --measure-heading:26em;\n  --measure-body:34em;\n  --measure-lead:36em;\n  --measure-row:44em;\n}\n\n:root{\n  --space-1:4px;\n  --space-2:8px;\n  --space-3:12px;\n  --space-4:16px;\n  --space-5:20px;\n  --space-6:26px;\n  --space-7:32px;\n  --space-8:40px;\n  --space-9:56px;\n\n  /* Rhythm — fluid pairs used across pages */\n  --gap-section-y:clamp(56px,9vw,110px);\n  --gap-section-y-home:220px;\n  --gap-heading-to-content:clamp(40px,5vw,64px);\n  --gap-heading-to-para:22px;\n  --gap-label-to-list:26px;\n  --gap-section-list-start:clamp(48px,6vw,72px);\n  --gap-block:clamp(32px,4vw,48px);\n  --gap-grid:clamp(24px,3vw,40px);\n\n  --row-padding-y:14px;\n  --row-padding-y-titled:16px;\n  --marker-col:24px;\n  --marker-gap:12px;\n\n  --tile-min-height:210px;\n  --tile-padding:clamp(18px,2vw,26px);\n  --panel-padding:clamp(24px,3.5vw,40px);\n  --card-padding:clamp(20px,2.4vw,28px);\n}\n\n:root{\n  --container-max:1220px;\n  --container-pad:clamp(20px,5vw,72px);\n  --rail-width:clamp(98px,15vw,170px);\n  --workrow-index-col:clamp(40px,5vw,64px);\n  --rail-gap:clamp(16px,4vw,56px);\n  --header-pad-y:clamp(16px,2.4vw,22px);\n\n  --bento-columns:6;\n  --bento-row-height:clamp(120px,13vw,150px);\n  --bento-rule:1px;\n  --bento-collapse:900px;\n\n  --radius-tag:2px;\n  --radius-dot:50%;\n\n  --ease-hover:.2s ease;\n  --ease-panel:.28s cubic-bezier(.2,.7,.3,1);\n  --focus-ring-width:2px;\n  --focus-ring-offset:2px;\n  --ease-nudge:.22s cubic-bezier(.2,.7,.3,1);\n  --nudge-distance:6px;\n  --image-zoom:1.045;\n}\n\n:root{\n  --shadow-card:0 1px 2px rgba(19,19,19,0.02),0 12px 24px -8px rgba(19,19,19,0.05),0 40px 60px -30px rgba(19,19,19,0.07);\n  --shadow-none:none;\n}\n\n/* Interaction states. Inline styles cannot express :hover or :focus,\n   so every stateful treatment lives here. Load after the token files. */\n\nbody{\n  margin:0;\n  background:var(--surface-page);\n  color:var(--text-body);\n  font-family:var(--font-sans);\n  -webkit-font-smoothing:antialiased;\n}\n*{box-sizing:border-box;}\n::selection{background:var(--selection-bg);color:var(--selection-fg);}\n\na{color:var(--link);text-decoration:none;}\na:hover{color:var(--link-hover);}\na:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset);}\n\n/* Links ─ background moves, text darkens */\n.ds-link{\n  color:var(--link);\n  border-bottom:1px solid var(--link-rule);\n  padding:2px 4px 3px;\n  transition:background var(--ease-hover),color var(--ease-hover),border-color var(--ease-hover);\n}\n.ds-link:hover,.ds-link:focus-visible{\n  background:var(--surface-hover);\n  color:var(--link-hover);\n  border-bottom-color:var(--link-hover);\n}\n.ds-link--secondary{color:var(--link-secondary);border-bottom-color:var(--link-secondary-rule);}\n.ds-link--secondary:hover,.ds-link--secondary:focus-visible{\n  color:var(--link-secondary-hover);\n  border-bottom-color:var(--link-secondary-hover);\n}\n\n/* Nav ─ colour only, no rule */\n.ds-navlink{color:var(--text-secondary);transition:color var(--ease-hover);}\n.ds-navlink:hover{color:var(--text-heading);}\n.ds-navlink[aria-current]{color:var(--text-heading);}\n\n/* Clickable rows and tiles ─ tint the ground, hold the text */\n.ds-row{background:var(--surface-raised);transition:background var(--ease-hover);}\n.ds-row:hover{background:var(--surface-hover);}\n.ds-row__arrow{color:var(--text-accent);align-self:center;justify-self:end;display:inline-block;transition:transform var(--ease-nudge);}\n.ds-row:hover .ds-row__arrow{transform:translateX(var(--nudge-distance));}\n.ds-tile{transition:background var(--ease-hover),box-shadow var(--ease-hover);}\n.ds-tile:hover{background:var(--surface-hover);}\n\n/* Images zoom on the inner element only */\n.ds-zoom{transition:transform .45s cubic-bezier(.2,.7,.3,1);}\n.ds-zoom-host:hover .ds-zoom{transform:scale(var(--image-zoom));}\n\n/* Accordion ─ height animates, glyph swaps, never rotates */\n.ds-accordion__panel{overflow:hidden;height:0;opacity:0;transition:height var(--ease-panel),opacity var(--ease-hover);}\n.ds-accordion__panel[data-open=\"true\"]{opacity:1;}\n\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important;}\n}\n\n<\u002Fstyle>\n<script src=\"edd9ebb0-3d64-4c3a-9785-29003605e81e\"><\u002Fscript>\n<style>\nbody{overflow-x:clip;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:var(--font-sans);color:var(--ink-900);background:var(--surface-page);-webkit-font-smoothing:antialiased\">\n\n  <header data-screen-label=\"PSEG\" style=\"position:sticky;top:0;z-index:60;background:var(--surface-header);border-bottom:1px solid var(--border-rule)\">\n    <div style=\"max-width:var(--container-max);margin:0 auto;padding:var(--header-pad-y) var(--container-pad);display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:16px\">\n      <a href=\"Home.dc.html\" style=\"font-size:16px;font-weight:600;letter-spacing:-0.01em;color:var(--ink-900)\">Bruce Criscuolo<\u002Fa>\n      <nav style=\"display:flex;flex-wrap:wrap;align-items:baseline;gap:clamp(12px,1.8vw,26px);font-size:13px;font-weight:500;letter-spacing:0.01em\">\n        <a class=\"ds-navlink\" href=\"Work.dc.html\" aria-current=\"page\">Work<\u002Fa>\n        <a class=\"ds-navlink\" href=\"About.dc.html\">About<\u002Fa>\n        <a class=\"ds-navlink\" href=\"Resume.dc.html\">Resume<\u002Fa>\n        <a class=\"ds-navlink\" href=\"Contact.dc.html\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <div style=\"width:100vw;margin-left:calc(50% - 50vw);border-bottom:1px solid var(--border-rule);height:clamp(320px,62vh,720px)\">\n    <image-slot id=\"pseg-hero\" shape=\"rect\" fit=\"cover\" placeholder=\"High-level system image — the customer experience direction at a glance\"><\u002Fimage-slot>\n  <\u002Fdiv>\n\n  <div style=\"max-width:var(--container-max);margin:0 auto;padding:0 var(--container-pad)\">\n\n    <section style=\"padding:var(--gap-section-y) 0 var(--gap-block);display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:13px\"><a class=\"ds-navlink\" href=\"Work.dc.html\">← Work<\u002Fa><\u002Fdiv>\n      <div>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:clamp(16px,3vw,28px)\">\n          <span style=\"height:34px;min-width:110px;border:1px dashed var(--border-rule);display:grid;place-items:center;font-size:11px;color:var(--ink-400)\">PSE&amp;G logo<\u002Fspan>\n          <span style=\"font-size:13px;color:var(--ink-400);font-variant-numeric:tabular-nums\">Enterprise CX · 5–7 minute read<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:26px 0 0;max-width:var(--measure-heading);font-size:var(--type-title-size);font-weight:500;letter-spacing:-0.038em;line-height:1.03;text-wrap:pretty\">Turning customer understanding into a system for change.<\u002Fh1>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-lead);font-size:var(--type-lead-size);line-height:1.6;color:var(--ink-700);text-wrap:pretty\">PSEG needed one customer direction across fragmented services and teams.<\u002Fp>\n        <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-500);text-wrap:pretty\">Two or three sentences stating the problem, the mandate, and the strongest outcome. This is the paragraph a hiring leader reads before deciding whether to continue.<\u002Fp>\n\n        <div style=\"margin-top:var(--gap-heading-to-content);max-width:44em;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap-grid)\">\n          <div style=\"padding-bottom:16px;border-bottom:1px solid var(--border-rule)\"><div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.3\">My role<\u002Fdiv><div style=\"margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink-500)\">Daily experience design lead<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding-bottom:16px;border-bottom:1px solid var(--border-rule)\"><div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.3\">Scope<\u002Fdiv><div style=\"margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink-500)\">Research, synthesis, strategy, IA, content<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding-bottom:16px;border-bottom:1px solid var(--border-rule)\"><div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.3\">Duration<\u002Fdiv><div style=\"margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink-500)\">00 months<\u002Fdiv><\u002Fdiv>\n          <div style=\"padding-bottom:16px;border-bottom:1px solid var(--border-rule)\"><div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em;line-height:1.3\">Team<\u002Fdiv><div style=\"margin-top:8px;font-size:15px;line-height:1.45;color:var(--ink-500)\">Roles, count<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">01<\u002Fspan><br>Context<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">Needs crossed digital, contact-center, field, brand, and delivery boundaries.<\u002Fh2>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">Two or three paragraphs on the organizational, customer, and delivery conditions that made the work difficult. Name the fragmentation and who owned which part of the experience.<\u002Fp>\n        <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">Second paragraph of context.<\u002Fp>\n        <div style=\"margin-top:var(--gap-heading-to-content)\">\n          <div style=\"height:clamp(220px,30vw,380px)\">\n            <image-slot id=\"pseg-coverage\" shape=\"rect\" fit=\"contain\" placeholder=\"Research coverage view — where the field evidence came from\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;max-width:var(--measure-body);font-size:13px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">Caption. State what this artifact revealed or changed — not what it is.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">02<\u002Fspan><br>Mandate<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">I led daily experience design across research, synthesis, strategy, IA, content, and alignment.<\u002Fh2>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">One paragraph on what I led, what I influenced, and what I personally made.<\u002Fp>\n        <div style=\"margin-top:var(--gap-heading-to-content);display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--gap-grid);max-width:60em\">\n          <div style=\"background:var(--surface-panel);padding:var(--panel-padding)\">\n            <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">What I owned<\u002Fdiv>\n            <div style=\"margin-top:20px;max-width:var(--measure-row);overflow:hidden\">\n              <div style=\"margin-bottom:-1px\">\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-rule);font-size:15px;line-height:1.55;color:var(--ink-700)\"><span style=\"color:var(--text-accent)\">→<\u002Fspan><span>One line per responsibility.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-rule);font-size:15px;line-height:1.55;color:var(--ink-700)\"><span style=\"color:var(--text-accent)\">→<\u002Fspan><span>One line per responsibility.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-rule);font-size:15px;line-height:1.55;color:var(--ink-700)\"><span style=\"color:var(--text-accent)\">→<\u002Fspan><span>One line per responsibility.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:var(--surface-panel);padding:var(--panel-padding)\">\n            <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">What the team carried<\u002Fdiv>\n            <div style=\"margin-top:20px;max-width:var(--measure-row);overflow:hidden\">\n              <div style=\"margin-bottom:-1px\">\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-rule);font-size:15px;line-height:1.55;color:var(--ink-700)\"><span style=\"color:var(--text-accent)\">→<\u002Fspan><span>Stated separately from my own work.<\u002Fspan><\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--border-rule);font-size:15px;line-height:1.55;color:var(--ink-700)\"><span style=\"color:var(--text-accent)\">→<\u002Fspan><span>Stated separately from my own work.<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">03<\u002Fspan><br>Insight and decisions<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">Field evidence became seven patterns, five personas, and journey models of behavior and emotion.<\u002Fh2>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">One or two paragraphs on the evidence that changed understanding. Name the method only where it changed a decision.<\u002Fp>\n\n        <div style=\"margin-top:var(--gap-heading-to-content);overflow:hidden\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 -1px -1px 0;\">\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;min-height:var(--tile-min-height);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">7<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Behavioral patterns<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;min-height:var(--tile-min-height);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">5<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Personas<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;min-height:var(--tile-min-height);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-md)\">00<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Label for one more source-controlled figure<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n\n        <div style=\"margin-top:var(--gap-block)\">\n          <div style=\"height:clamp(240px,34vw,460px)\">\n            <image-slot id=\"pseg-personas\" shape=\"rect\" fit=\"contain\" placeholder=\"Persona plus journey or radial model — behavior and emotion\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;max-width:var(--measure-body);font-size:13px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">Caption. What the model revealed about behavior and emotion, and which decision it moved.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:var(--gap-block);background:var(--surface-panel);padding:var(--panel-padding)\">\n          <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">The decision<\u002Fdiv>\n          <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">The models reshaped IA and self-service content around customer intent. One paragraph on what was chosen and what was set aside.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">04<\u002Fspan><br>Designed response<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">Information architecture became the central proof.<\u002Fh2>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">One or two paragraphs on the resulting direction and how intent shaped the structure.<\u002Fp>\n        <div style=\"margin-top:var(--gap-heading-to-content)\">\n          <div style=\"height:clamp(300px,42vw,560px);box-shadow:var(--shadow-card)\">\n            <image-slot id=\"pseg-ia\" shape=\"rect\" fit=\"contain\" placeholder=\"Information architecture — readable crop or reconstruction\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;max-width:var(--measure-body);font-size:13px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">Caption. What the architecture changed about how customers reach what they came for.<\u002Fp>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:var(--gap-block) 0 0;max-width:var(--measure-heading);font-size:var(--type-phase-size);font-weight:500;letter-spacing:-0.025em;text-wrap:pretty\">The direction had to survive development.<\u002Fh3>\n        <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">Fifty-three templates and 265 components carried the direction into development, governance, and continued improvement. A phased roadmap connected the work to what followed.<\u002Fp>\n        <div style=\"margin-top:var(--gap-grid);overflow:hidden\"><div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin:0 -1px -1px 0;\">\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;min-height:var(--tile-min-height);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">53<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Templates<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"ds-tile\" style=\"display:flex;flex-direction:column;gap:10px;min-height:var(--tile-min-height);padding:var(--tile-padding);box-shadow:inset -1px 0 0 var(--border-rule),inset 0 -1px 0 var(--border-rule)\">\n            <span style=\"font-weight:400;letter-spacing:-0.045em;line-height:0.95;font-variant-numeric:tabular-nums;font-size:var(--type-figure-lg)\">265<\u002Fspan>\n            <span style=\"font-size:clamp(14px,1.4vw,17px);letter-spacing:-0.015em;line-height:1.3;color:var(--ink-700);text-wrap:pretty\">Components<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv><\u002Fdiv>\n        <div style=\"margin-top:var(--gap-block)\">\n          <div style=\"height:clamp(240px,34vw,460px);box-shadow:var(--shadow-card)\">\n            <image-slot id=\"pseg-system\" shape=\"rect\" fit=\"contain\" placeholder=\"Template and component system — 53 templates, 265 components\"><\u002Fimage-slot>\n          <\u002Fdiv>\n          <p style=\"margin:16px 0 0;max-width:var(--measure-body);font-size:13px;line-height:1.6;color:var(--ink-500);text-wrap:pretty\">Caption. What the system made possible for the teams who inherited it.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">05<\u002Fspan><br>Outcome and reflection<\u002Fdiv>\n      <div>\n        <h2 style=\"margin:0;max-width:var(--measure-heading);font-size:var(--type-section-size);font-weight:500;letter-spacing:-0.03em;line-height:1.1;text-wrap:pretty\">The materials spread beyond the team.<\u002Fh2>\n        <p style=\"margin:var(--gap-heading-to-para) 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">One paragraph on where the work travelled and what it changed organizationally.<\u002Fp>\n\n        <div style=\"margin-top:var(--gap-heading-to-content);display:flex;flex-wrap:wrap;gap:var(--gap-grid)\">\n          <div style=\"background:var(--surface-panel);aspect-ratio:1 / 1;width:100%;max-width:300px;display:flex;flex-direction:column;justify-content:space-between;padding:var(--card-padding)\">\n            <span style=\"width:72px;height:72px;border:1px dashed var(--border-rule);display:grid;place-items:center;font-size:11px;color:var(--ink-400)\">Badge<\u002Fspan>\n            <div>\n              <div style=\"font-size:13px;font-weight:700;color:var(--text-accent);line-height:1.6\">Later recognition<\u002Fdiv>\n              <div style=\"margin-top:6px;font-size:clamp(19px,2vw,23px);font-weight:500;letter-spacing:-0.025em;line-height:1.2;text-wrap:pretty\">J.D. Power number-one ranking<\u002Fdiv>\n              <div style=\"margin-top:8px;font-size:13px;line-height:1.5;color:var(--ink-500)\">PSE&amp;G, following a broader multi-year program<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1 1 280px;min-width:0;background:var(--surface-panel);padding:var(--panel-padding)\">\n            <div style=\"font-size:17px;font-weight:600;letter-spacing:-0.015em\">How this is stated<\u002Fdiv>\n            <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:15px;line-height:1.6;color:var(--ink-700);text-wrap:pretty\">This engagement was an early contributor to a multi-year improvement effort. The design work laid a foundation; the later ranking and industry recognition followed a broader program and many teams.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <h3 style=\"margin:var(--gap-block) 0 0;max-width:var(--measure-heading);font-size:var(--type-phase-size);font-weight:500;letter-spacing:-0.025em;text-wrap:pretty\">One reflection.<\u002Fh3>\n        <p style=\"margin:18px 0 0;max-width:var(--measure-body);font-size:16px;line-height:1.65;color:var(--ink-700);text-wrap:pretty\">One paragraph: what I would do differently, or what this taught me about carrying understanding into delivery.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-top:1px solid var(--border-rule);padding:var(--gap-section-y) 0;display:grid;grid-template-columns:var(--rail-width) minmax(0,1fr);gap:var(--rail-gap)\">\n      <div style=\"font-size:var(--type-marker-size);font-weight:var(--type-marker-weight);color:var(--text-accent);line-height:var(--type-marker-leading)\"><span style=\"font-weight:400\">06<\u002Fspan><br>Next<\u002Fdiv>\n      <div>\n        <a class=\"ds-row\" href=\"HomeServe.dc.html\" style=\"color:var(--ink-900);display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:clamp(14px,2.4vw,32px);align-items:center;padding:var(--card-padding) clamp(10px,1.4vw,16px);border-top:1px solid var(--border-rule);border-bottom:1px solid var(--border-rule)\">\n          <span style=\"min-width:0\">\n            <span style=\"display:block;font-size:13px;font-weight:500;letter-spacing:0.02em;color:var(--ink-500)\">Next project · HomeServe<\u002Fspan>\n            <span style=\"display:block;margin-top:8px;font-size:clamp(18px,2.1vw,26px);font-weight:500;letter-spacing:-0.025em;line-height:1.2;text-wrap:pretty\">Making service transformation financially actionable<\u002Fspan>\n          <\u002Fspan>\n          <span class=\"ds-row__arrow\">→<\u002Fspan>\n        <\u002Fa>\n        <div style=\"margin-top:var(--gap-block);display:flex;flex-wrap:wrap;align-items:baseline;gap:clamp(20px,3vw,32px)\">\n          <a class=\"ds-link\" href=\"Contact.dc.html\" style=\"font-size:var(--type-cta-size);font-weight:var(--type-cta-weight);letter-spacing:var(--type-cta-tracking)\">Start a conversation<\u002Fa>\n          <a class=\"ds-link ds-link--secondary\" href=\"Resume.dc.html\" style=\"font-size:15px;font-weight:500\">Read my resume<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <footer style=\"border-top:1px solid var(--border-rule)\">\n    <div style=\"max-width:var(--container-max);margin:0 auto;padding:clamp(32px,5vw,56px) var(--container-pad);display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:var(--gap-grid);align-items:baseline\">\n      <span style=\"font-size:13px;font-weight:500\">Bruce Criscuolo<\u002Fspan>\n      <a class=\"ds-link ds-link--secondary\" href=\"mailto:\" style=\"font-size:13px;justify-self:start\">email@domain.com<\u002Fa>\n      <a class=\"ds-link ds-link--secondary\" href=\"#\" style=\"font-size:13px;justify-self:start\">LinkedIn<\u002Fa>\n      <span style=\"font-size:13px;color:var(--ink-500)\">City, region<\u002Fspan>\n      <span style=\"font-size:13px;color:var(--ink-500)\">Open to principal design and design leadership conversations.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
